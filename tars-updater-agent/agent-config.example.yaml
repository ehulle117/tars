# Discord posting is configured via env vars, not this file:
#   DISCORD_BOT_TOKEN   - Tars bot token (discord-alerts Secret, key bot_token)
#   DIGEST_CHANNEL_ID   - plain text channel the weekly digest posts to

schedule:
  daily_scan_time: "02:00"
  weekly_digest_day: "sunday"
  weekly_digest_time: "08:00"

scanners:
  enable_docker: true
  enable_os: false # Enable if host OS paths are mounted
  enable_trivy: true

ignore:
  containers:
    - "watchtower"
  packages: []
