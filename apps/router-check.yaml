apiVersion: v1
kind: ConfigMap
metadata:
  name: router-check-script
  namespace: apps
data:
  check.py: |
    import json
    import os
    import subprocess
    import sys
    from datetime import datetime

    sys.path.insert(0, "/lib")
    from alert_lib import post_digest

    ROUTER_HOST = os.environ["ROUTER_HOST"]
    SSH_KEY_PATH = "/ssh/id_ed25519"

    SSH_BASE = [
        "ssh", "-i", SSH_KEY_PATH, "-o", "StrictHostKeyChecking=no",
        "-o", "ConnectTimeout=10", "-o", "BatchMode=yes",
        f"root@{ROUTER_HOST}",
    ]


    def ssh_run(remote_cmd, timeout=15):
        return subprocess.run(SSH_BASE + [remote_cmd], capture_output=True, text=True, timeout=timeout)


    # --- WAN reachability: a real problem, goes through the alert queue ---
    alert_findings = []

    wan = ssh_run("ubus call network.interface.wan status")
    if wan.returncode != 0:
        # Covers both "router unreachable" and "ubus/wan iface renamed" -
        # either way it's worth a look, and there's nothing more specific
        # to say without a successful connection.
        alert_findings.append(f"couldn't reach router or query WAN status: {(wan.stderr or wan.stdout).strip()[:200]}")
    else:
        try:
            status = json.loads(wan.stdout)
            if not status.get("up"):
                alert_findings.append("WAN interface is down")
        except json.JSONDecodeError:
            alert_findings.append(f"unexpected ubus output: {wan.stdout.strip()[:200]}")

    if alert_findings:
        text_body = "\n".join(f"- {f}" for f in alert_findings)
        print(f"Found {len(alert_findings)} router issue(s), queuing for triage.")
        queue_dir = "/queue/.tars-triage-queue"
        os.makedirs(queue_dir, exist_ok=True)
        stamp = datetime.now().strftime("%Y%m%d%H%M%S")
        with open(f"{queue_dir}/router-check-{stamp}.txt", "w") as f:
            f.write(text_body)
    else:
        print("Router reachable, WAN up.")

        # --- pending OS packages: routine info, not a problem - posts
        # straight to the digest channel, no GitHub issue, no triage ---
        upgradable = ssh_run("opkg list-upgradable")
        if upgradable.returncode == 0 and upgradable.stdout.strip():
            pkgs = upgradable.stdout.strip().splitlines()
            content = "**Router (OpenWrt) package updates available**\n" + "\n".join(f"- {p.split()[0]}" for p in pkgs[:20])
            post_digest(os.environ["DISCORD_BOT_TOKEN"], os.environ["DIGEST_CHANNEL_ID"],
                        f"router: {len(pkgs)} package update(s)", content)
            print(f"Posted {len(pkgs)} upgradable package(s) to the digest channel.")
        else:
            print("No pending router package updates.")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: router-check
  namespace: apps
spec:
  schedule: "*/30 * * * *" # every 30 min
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: router-check
            image: python:3.12-alpine
            command: ["sh", "-c", "apk add --no-cache openssh-client >/dev/null && python /scripts/check.py"]
            env:
            - name: ROUTER_HOST
              value: "192.168.8.1"
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-alerts
                  key: bot_token
            - name: DIGEST_CHANNEL_ID
              value: "1547598576111194205"
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: lib
              mountPath: /lib
            - name: ssh-key
              mountPath: /ssh
              readOnly: true
            - name: triage-queue
              mountPath: /queue
          restartPolicy: OnFailure
          volumes:
          - name: script
            configMap:
              name: router-check-script
          - name: lib
            configMap:
              name: alert-lib
          - name: ssh-key
            secret:
              secretName: router-ssh-key
              defaultMode: 0400
          - name: triage-queue
            persistentVolumeClaim:
              claimName: nfs-media-pvc
