apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fetcharr-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path 
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcharr
  namespace: apps
  labels:
    app: fetcharr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fetcharr
  strategy:
    type: Recreate 
  template:
    metadata:
      labels:
        app: fetcharr
    spec:
      nodeSelector:
        kubernetes.io/hostname: tars
      containers:
        - name: fetcharr
          image: egg82/fetcharr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
            - name: LOG_MODE
              value: "info"
            - name: SEARCH_AMOUNT
              value: "5"
            - name: SEARCH_INTERVAL
              value: "1hour"
            - name: RADARR_0_URL
              value: "http://radarr-svc.apps.svc.cluster.local:7878"
            - name: SONARR_0_URL
              value: "http://sonarr-svc.apps.svc.cluster.local:8989"
            - name: LIDARR_0_URL
              value: "http://lidarr-svc.apps.svc.cluster.local:8686"
            - name: READARR_0_URL
              value: "http://readarr-svc.apps.svc.cluster.local:8787"
          envFrom:
            - secretRef:
                name: fetcharr-secrets
          # Fetcharr's main thread can die (e.g. an *arr is down at startup) while
          # the JVM keeps running, so the pod stays "Running" and never searches
          # again. It logs on startup and every SEARCH_INTERVAL run; no log write
          # in 2.5 intervals means it's wedged - restart it. Repeated restarts
          # then trip pod-health-check's restart alert.
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -n \"$(find /app/logs -maxdepth 1 -name 'fetcharr-*' -mmin -150)\""]
            initialDelaySeconds: 300
            periodSeconds: 600
            timeoutSeconds: 10
            failureThreshold: 1
          volumeMounts:
            - name: config
              mountPath: /app/config
              subPath: config
            - name: config
              mountPath: /app/cache
              subPath: cache
            - name: config
              mountPath: /app/logs
              subPath: logs
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: fetcharr-config-pvc
