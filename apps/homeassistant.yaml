apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: apps
  labels:
    app: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      # The Sonoff Zigbee dongle is plugged into tars.
      nodeSelector:
        kubernetes.io/hostname: tars
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
          # Privileged (like ARM) so the container gets the dongle's
          # /dev/ttyUSB*/ttyACM* node. ponytail: device nodes are copied in at
          # container start, so plugging the dongle in (or replugging it) needs
          # a pod restart; a USB device plugin would avoid that.
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - containerPort: 8123
          volumeMounts:
            - name: config
              mountPath: /config
            # Stable /dev/serial/by-id/usb-ITead_Sonoff_... names for ZHA, so
            # the config survives the dongle coming back as a different ttyUSBN.
            - name: dev-serial
              mountPath: /dev/serial
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config-pvc
        # DirectoryOrCreate so the pod still starts while the dongle is
        # unplugged (udev only creates /dev/serial once a serial device shows up).
        - name: dev-serial
          hostPath:
            path: /dev/serial
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: homeassistant
  ports:
    - protocol: TCP
      port: 8123
      targetPort: 8123
