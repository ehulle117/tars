# The one place Claude/gh/Discord triage happens. Every detector
# (pod-health-check, resource-pressure-check, arr-queue-check,
# deluge-stall-check, router-check, argo-sync-check, case-health-check, the
# three *-appdata-backup CronJobs, tars-updater-agent's critical-CVE alert)
# only ever detects and drops a file in .tars-triage-queue/ on the shared
# nfs-media-pvc - no detector triages its own findings anymore, and none of
# them know a Discord channel id or hold a GitHub token. This job drains
# that directory every run: one Claude+gh triage call per queue file (dedup
# against open issues, open/comment/skip), one Discord post per file to the
# single ALERTS_CHANNEL_ID, then deletes the file. A failed run leaves files
# in place for the next attempt, exits non-zero, and skips the Uptime Kuma
# heartbeat - triage can't queue an alert about itself, so Kuma is the only
# thing that notices it's broken (it silently failed every file for a week
# on an expired Claude login before the 2026-10-13 outage).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tars-alert-triage-script
  namespace: apps
data:
  check.py: |
    import os
    import re
    import subprocess
    import sys
    import time

    sys.path.insert(0, "/alert-lib")
    from alert_lib import post_and_track, run_triage, triage_prompt

    BOT_TOKEN = os.environ["DISCORD_BOT_TOKEN"]
    ALERTS_CHANNEL_ID = os.environ["ALERTS_CHANNEL_ID"]
    REPO = os.environ["GITHUB_REPO"]
    QUEUE_DIR = "/queue/.tars-triage-queue"


    def run_with_retries(cmd, attempts=3, delay_seconds=10, **kwargs):
        """Retries a subprocess call a few times before giving up - a single
        flaky external service (apk mirror, npm registry, GitHub releases)
        during the bootstrap below used to cost a full pod restart instead
        of a quick in-process retry (tars#48)."""
        last_error = None
        for attempt in range(1, attempts + 1):
            try:
                return subprocess.run(cmd, check=True, **kwargs)
            except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as e:
                last_error = e
                if attempt < attempts:
                    print(f"Attempt {attempt}/{attempts} failed ({e}), retrying in {delay_seconds}s...")
                    time.sleep(delay_seconds)
        raise last_error


    def source_label(fname):
        # Strip the trailing "-YYYYMMDDHHMMSS.txt" a detector stamps its
        # queue file with, leaving just the detector's name as the label.
        return re.sub(r"-\d{14}\.txt$", "", fname)


    if not os.path.isdir(QUEUE_DIR) or not os.listdir(QUEUE_DIR):
        print("Queue empty, nothing to triage.")
    else:
        # Bootstrap Claude Code + gh CLI only when there's actually
        # something to triage. Each network step gets its own timeout so a
        # stalled fetch fails and gets retried instead of hanging (tars#121,
        # #130); the outer timeout only kills sh, not a hung apk/npm under it.
        # The final --version calls catch a truncated binary that installed
        # "successfully" (Exec format error on every file, 2026-10-15); --force
        # makes the retry reinstall instead of treating it as up to date.
        # gh comes from Alpine's github-cli package: the old unauthenticated
        # api.github.com version lookup intermittently came back empty, so curl
        # saved a 404 page and tar failed all 3 attempts (2026-10-16).
        run_with_retries(["sh", "-c",
            "timeout 120 apk add --no-cache nodejs npm bash curl tar github-cli && "
            "timeout 180 npm install -g --force @anthropic-ai/claude-code && "
            "claude --version && gh --version"
        ], timeout=420)

        failed = 0
        for fname in sorted(os.listdir(QUEUE_DIR)):
            fpath = os.path.join(QUEUE_DIR, fname)
            with open(fpath) as f:
                findings = f.read().strip()
            if not findings:
                os.remove(fpath)
                continue

            label = source_label(fname)
            try:
                prompt = triage_prompt(label, findings, REPO)
                message, action, issue_num = run_triage(prompt)
                message = message or findings

                post_and_track(BOT_TOKEN, ALERTS_CHANNEL_ID, label, message, REPO, action, issue_num)
                print(f"[{label}] triaged: {message}")
                os.remove(fpath)
            except Exception as e:
                # Leave the file in place for the next scheduled run rather
                # than crashing the pod - one bad file used to take down
                # triage for every other file in the queue too (tars#85).
                failed += 1
                # CalledProcessError's own message drops claude's output,
                # which is where the actual reason (e.g. expired auth) is.
                detail = ((getattr(e, "stdout", "") or "") + (getattr(e, "stderr", "") or "")).strip()[-500:]
                print(f"[{label}] triage failed, leaving in queue for retry: {e} {detail}")

        if failed:
            sys.exit(f"{failed} queue file(s) failed triage")

    kuma_url = os.environ.get("KUMA_PUSH_URL")
    if kuma_url:
        # Non-fatal: Kuma already alerts on a missed heartbeat, and failing
        # here marked a run that triaged fine as Failed (tars#121).
        try:
            subprocess.run(["wget", "-q", "-O-", kuma_url], check=True, timeout=15)
        except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as e:
            print(f"uptime-kuma heartbeat failed (non-fatal): {e}")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tars-alert-triage
  namespace: apps
spec:
  schedule: "13-59/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          # Never (not OnFailure): a failed run already leaves its files for
          # the next scheduled run, and an in-pod restart would just redo the
          # whole npm/gh bootstrap against the same failure.
          restartPolicy: Never
          # The bootstrap above fetches gh's linux_amd64 build, so stay off the
          # arm64 Pi now that this isn't pinned to tars anymore.
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
          - name: tars-alert-triage
            image: python:3.12-alpine
            command: ["python", "/scripts/check.py"]
            env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-alerts
                  key: bot_token
            - name: ALERTS_CHANNEL_ID
              value: "1546905058099331202"
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: token
            - name: GITHUB_REPO
              value: "ehulle117/tars"
            - name: HOME
              value: "/root"
            # Long-lived token from `claude setup-token` (subscription auth, no
            # API billing). Replaces reusing the claude-code dev pod's login off
            # its tars-local PVC, which pinned triage to tars and expired.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-oauth
                  key: token
            - name: KUMA_PUSH_URL
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-push
                  key: tars_alert_triage_url
                  optional: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: lib
              mountPath: /alert-lib
            - name: triage-queue
              mountPath: /queue
          volumes:
          - name: script
            configMap:
              name: tars-alert-triage-script
          - name: lib
            configMap:
              name: alert-lib
          - name: triage-queue
            persistentVolumeClaim:
              claimName: nfs-media-pvc
