            claimName: adsb-tools-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: adsb-tools-coverage-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: adsb-tools-coverage
  ports:
    - protocol: TCP
      port: 8767
      targetPort: 8767
