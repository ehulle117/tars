# Lets Etan @-mention the Tars bot to restart Ashlands Ascendant remotely
# -- e.g. from a phone, when the "Game server connected failed" stuck state
# recurs and nobody's home to fix it.
#
# 2026-09-24: valheim2 moved back to k3s (see apps/valheim2.yaml's history
# and the daily notes for why -- a Docker embedded-DNS bug specific to the
# native setup on `case`). This bot moved with it: restarts now go through
# `kubectl rollout restart` against the in-cluster API using this pod's own
# ServiceAccount, instead of SSHing into `case` and running `docker
# restart`. Simpler than the SSH path it replaces, not more complex --
# no key material to manage, just a narrowly-scoped Role.
#
# Reuses the existing Tars bot token (discord-alerts/bot_token, same one
# router-check/tars-alert-triage post with) -- no new bot application, no
# new keys.
#
# Restricted to ALLOWED_USER_IDS (comma-separated Discord user IDs) --
# anyone else who @-mentions the bot gets told no. Only fires on
# "@Tars restart valheim" (case/whitespace-insensitive) so a plain
# @mention in conversation doesn't trigger a restart by accident.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valheim2-restart-bot
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: valheim2-restart-bot
  namespace: apps
rules:
  # Scoped to just the valheim2 Deployment -- enough to read its status and
  # trigger a rollout restart, nothing else.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["valheim2"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: valheim2-restart-bot
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: valheim2-restart-bot
    namespace: apps
roleRef:
  kind: Role
  name: valheim2-restart-bot
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim2-restart-bot-script
  namespace: apps
data:
  bot.py: |
    import logging
    import os
    import re
    import subprocess

    import discord

    logging.basicConfig(level=logging.INFO)
    log = logging.getLogger("valheim2-restart-bot")

    TOKEN = os.environ["DISCORD_BOT_TOKEN"]
    ALLOWED_USER_IDS = {
        int(uid) for uid in os.environ["ALLOWED_USER_IDS"].split(",") if uid.strip()
    }
    DEPLOYMENT_NAME = os.environ.get("DEPLOYMENT_NAME", "valheim2")
    COMMAND_PHRASE = "restart valheim"

    intents = discord.Intents.default()
    client = discord.Client(intents=intents)


    @client.event
    async def on_ready():
        log.info("Logged in as %s", client.user)


    def strip_mentions(content):
        """Removes <@id>/<@!id> mention tokens, collapses whitespace, lowercases."""
        text = re.sub(r"<@!?\d+>", "", content)
        return re.sub(r"\s+", " ", text).strip().lower()


    @client.event
    async def on_message(message):
        if message.author.bot or client.user not in message.mentions:
            return

        log.info(
            "mentioned by %s (%s) in guild=%s channel=%s content=%r",
            message.author, message.author.id,
            message.guild.id if message.guild else "dm",
            message.channel.id, message.content,
        )

        if message.author.id not in ALLOWED_USER_IDS:
            log.info("rejected: %s not in ALLOWED_USER_IDS=%s", message.author.id, ALLOWED_USER_IDS)
            await message.reply("Not authorized to do that.")
            return

        command = strip_mentions(message.content)
        if COMMAND_PHRASE not in command:
            log.info("rejected: stripped content %r does not contain %r", command, COMMAND_PHRASE)
            await message.reply(
                f'Mention me with "restart valheim" to restart `{DEPLOYMENT_NAME}`.'
            )
            return

        log.info("authorized restart request from %s", message.author.id)

        await message.reply(f"Restarting `{DEPLOYMENT_NAME}`...")
        try:
            result = subprocess.run(
                ["kubectl", "rollout", "restart", f"deployment/{DEPLOYMENT_NAME}", "-n", "apps"],
                capture_output=True, text=True, timeout=30,
            )
        except subprocess.TimeoutExpired:
            await message.reply("kubectl rollout restart timed out.")
            return

        if result.returncode == 0:
            await message.reply(
                f"Restarted `{DEPLOYMENT_NAME}`. Give it ~30-60s to come back up "
                "(Steam verify + world load)."
            )
        else:
            err = (result.stderr or result.stdout).strip()[:500]
            await message.reply(f"Restart failed: `{err}`")


    client.run(TOKEN)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim2-restart-bot
  namespace: apps
  labels:
    app: valheim2-restart-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valheim2-restart-bot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: valheim2-restart-bot
    spec:
      serviceAccountName: valheim2-restart-bot
      containers:
        - name: bot
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache kubectl
              pip install --quiet --no-cache-dir discord.py
              python /scripts/bot.py
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-alerts
                  key: bot_token
            - name: ALLOWED_USER_IDS
              value: "251566145092452352,472065214276304896,350408686025441280"
            - name: DEPLOYMENT_NAME
              value: "valheim2"
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: valheim2-restart-bot-script
