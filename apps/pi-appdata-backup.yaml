apiVersion: batch/v1
kind: CronJob
metadata:
  name: pi-appdata-backup
  namespace: apps
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  schedule: "30 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: k3s-worker-pi
          tolerations:
            - key: arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Starting backup of k3s local-path storage on k3s-worker-pi..."
                  DATE=$(date +%Y-%m-%d_%H-%M-%S)
                  mkdir -p /destination/pi_k8s_appdata
                  tar -czf /destination/pi_k8s_appdata/backup_${DATE}.tar.gz -C /source .
                  echo "Backup completed successfully: backup_${DATE}.tar.gz"
                  echo "Cleaning up backups older than 7 days..."
                  find /destination/pi_k8s_appdata -name "backup_*.tar.gz" -mtime +7 -delete
                  echo "Cleanup complete."
              volumeMounts:
                - name: source-data
                  mountPath: /source
                  readOnly: true
                - name: destination-data
                  mountPath: /destination
          volumes:
            - name: source-data
              hostPath:
                path: /var/lib/rancher/k3s/storage
                type: Directory
            - name: destination-data
              persistentVolumeClaim:
                claimName: nfs-media-pvc
