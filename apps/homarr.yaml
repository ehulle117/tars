apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homarr-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path 
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: apps
  labels:
    app: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  strategy:
    type: Recreate 
  template:
    metadata:
      labels:
        app: homarr
    spec:
      containers:
        - name: homarr
          # Pinned instead of :latest (tars#111). The running pod is still v1.77.x,
          # which bundles next 16.3.0-preview.9 (vulnerable to GHSA-vcvr-r3jv-pc5j,
          # fixed in next >= 16.3.6). Only v2.1.2+ bundles a patched next, and v2
          # is a major release (rebuilt board editor: "Containers" replace
          # "Groups"/dynamic sections) whose DB migration runs on first start.
          # :latest already == v2.2.0 (same digest), so with imagePullPolicy
          # Always any pod restart would have upgraded silently. Roll back by
          # restoring /appdata/db/db.sqlite.pre-v2-upgrade-backup and re-pinning
          # ghcr.io/homarr-labs/homarr:v1.77.2.
          image: ghcr.io/homarr-labs/homarr:v2.2.0
          envFrom:
            - secretRef:
                name: homarr-secrets
          ports:
            - containerPort: 7575
          volumeMounts:
            - name: config
              mountPath: /app/data
            - name: config
              mountPath: /data
              subPath: db
            - name: config
              mountPath: /appdata
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homarr-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: homarr-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: homarr
  ports:
    - protocol: TCP
      port: 7575
      targetPort: 7575
