apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: apps
  labels:
    app: flaresolverr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      nodeSelector:
        kubernetes.io/hostname: tars
      containers:
        - name: flaresolverr
          # Pinned instead of :latest (tars#73) - v3.5.2 bumps the bundled
          # Chromium, which is what CVE-2026-87544 (a Chrome CVE) actually
          # lives in.
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          env:
            - name: TZ
              value: "America/New_York"
            - name: LOG_LEVEL
              value: "info"
          ports:
            - containerPort: 8191
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr-svc
  namespace: apps
spec:
  selector:
    app: flaresolverr
  ports:
    - protocol: TCP
      port: 8191
      targetPort: 8191
