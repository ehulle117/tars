apiVersion: v1
kind: ConfigMap
metadata:
  name: deluge-local-cleanup-script
  namespace: apps
data:
  cleanup.py: |
    import json
    import os
    import re
    import sys
    import time
    import urllib.request
    from datetime import datetime, timezone

    try:
        from deluge_client import DelugeRPCClient
    except ImportError:
        os.system(f"{sys.executable} -m pip install --quiet deluge-client")
        from deluge_client import DelugeRPCClient

    DELUGE_HOST = os.environ.get("DELUGE_HOST", "deluge-svc.apps.svc.cluster.local")
    DELUGE_PORT = int(os.environ.get("DELUGE_PORT", "58846"))
    DELUGE_USERNAME = os.environ["DELUGE_USERNAME"]
    DELUGE_PASSWORD = os.environ["DELUGE_PASSWORD"]

    RADARR_HOST = "radarr-svc.apps.svc.cluster.local"
    RADARR_PORT = 7878
    RADARR_API_KEY = os.environ["RADARR_API_KEY"]

    BLURAY_QUALITY_MARKERS = ("Bluray", "Remux", "BR-DISK")


    def radarr_movies():
        req = urllib.request.Request(
            f"http://{RADARR_HOST}:{RADARR_PORT}/api/v3/movie",
            headers={"X-Api-Key": RADARR_API_KEY},
        )
        with urllib.request.urlopen(req, timeout=30) as resp:
            return json.loads(resp.read())


    def norm(title):
        return re.sub(r"[^a-z0-9]+", " ", title.lower()).strip()


    def file_added_ts(movie):
        added = ((movie.get("movieFile") or {}).get("dateAdded") or "")[:19]
        try:
            return datetime.strptime(added, "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc).timestamp()
        except ValueError:
            return None


    def match_movie(name_norm, completed_ts, movies):
        """The imported movie this torrent is the source of, or None. Name must
        start with the title and contain the year (a bare substring match once
        deleted The Cars albums for the movie "Cars"), and Radarr's file must
        have been added after the torrent finished - otherwise this is an
        upgrade grab Radarr hasn't imported yet."""
        for m in movies:
            title = norm(m["title"])
            added = file_added_ts(m)
            if (title and name_norm.startswith(title + " ") and str(m.get("year")) in name_norm.split()
                    and added is not None and completed_ts and added >= completed_ts):
                return m
        return None


    def is_imported(movie):
        mf = movie.get("movieFile") or {}
        quality = mf.get("quality", {}).get("quality", {}).get("name", "")
        return bool(quality) and any(marker in quality for marker in BLURAY_QUALITY_MARKERS)


    def connect_and_get_torrents(attempts=3, delay_seconds=10):
        """A fresh Deluge RPC connection per attempt - deluge_client's own
        automatic_reconnect doesn't help when the daemon itself is just slow
        to answer, and an unhandled timeout here used to crash the pod every
        run (tars#100/#102 - this job was hammering Deluge with failed
        reconnects on a tight OnFailure loop, plausibly starving Lidarr's
        own connection)."""
        last_error = None
        for attempt in range(1, attempts + 1):
            try:
                client = DelugeRPCClient(
                    DELUGE_HOST, DELUGE_PORT, DELUGE_USERNAME, DELUGE_PASSWORD, timeout=30
                )
                client.connect()
                torrents = client.call(
                    "core.get_torrents_status",
                    {},
                    [b"name", b"is_seed", b"save_path", b"completed_time"],
                )
                return client, torrents
            except Exception as e:
                last_error = e
                if attempt < attempts:
                    print(f"Attempt {attempt}/{attempts} failed ({e}), retrying in {delay_seconds}s...")
                    time.sleep(delay_seconds)
        raise last_error


    movies = radarr_movies()
    # only consider movies already confirmed at Bluray/Remux/BR-DISK quality --
    # anything still pending shouldn't have its local seed touched even if 100%
    # downloaded, since it may still be mid manual-import.
    imported = [m for m in movies if is_imported(m)]

    try:
        client, torrents = connect_and_get_torrents()
    except Exception as e:
        # Leave it for the next scheduled run (every 6h) rather than
        # crash-looping the pod on a transient Deluge slowdown/timeout.
        print(f"Couldn't reach Deluge after retries, skipping this run: {e}")
        sys.exit(0)

    to_remove = {}
    for torrent_id, status in torrents.items():
        if not status.get(b"is_seed"):
            continue
        save_path = (status.get(b"save_path") or b"").decode(errors="replace")
        # Radarr-only job: music/books/tv share the same /downloads tree.
        if save_path.rstrip("/") != "/downloads/complete/movies":
            continue
        name = status.get(b"name", torrent_id).decode(errors="replace")
        if not match_movie(norm(name), status.get(b"completed_time"), imported):
            continue
        to_remove[torrent_id.decode()] = name

    # Remove all in a single core.remove_torrents call instead of one
    # core.remove_torrent per torrent: rapid back-to-back mutations have
    # corrupted Deluge's in-memory torrent handles (invalid torrent handle
    # used [libtorrent:20]), hanging every status call until a pod restart.
    removed = []
    if to_remove:
        try:
            errors = client.call("core.remove_torrents", list(to_remove), True)
            errors = [(tid.decode(), err.decode(errors="replace")) for tid, err in errors]
            failed = {tid for tid, _ in errors}
            for tid, err in errors:
                print(f"Couldn't remove {to_remove.get(tid, tid)!r}, will retry next run: {err}")
            removed = [name for tid, name in to_remove.items() if tid not in failed]
        except Exception as e:
            print(f"Couldn't remove {len(to_remove)} torrent(s), will retry next run: {e}")

    if removed:
        print(f"Removed {len(removed)} already-imported torrent(s) and their local data:")
        for line in removed:
            print(f"  - {line}")
    else:
        print("No already-imported seeding torrents to clean up.")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deluge-local-cleanup
  namespace: apps
spec:
  # Was suspended 2026-09-30 as a wedge experiment (5 of 6 "invalid torrent
  # handle" wedges began 13-18s after a run started). With nothing removing
  # imported seeds, deluge-downloads-pvc filled tars's disk and caused the
  # 2026-10-13 DiskPressure outage. Back on, but every 6h instead of every
  # 15m: 24x fewer chances to trip a wedge, still bounded disk growth.
  schedule: "14 */6 * * *" # every 6 hours, :14 (clear of seed-cap :36, stall-check :41)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: deluge-local-cleanup
            image: python:3.12-alpine
            command: ["python", "/scripts/cleanup.py"]
            env:
            - name: DELUGE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: deluge-rpc-auth
                  key: USERNAME
            - name: DELUGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deluge-rpc-auth
                  key: PASSWORD
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-api-keys
                  key: RADARR_API_KEY
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: script
              mountPath: /scripts
          restartPolicy: OnFailure
          volumes:
          - name: script
            configMap:
              name: deluge-local-cleanup-script
