apiVersion: v1
kind: ConfigMap
metadata:
  name: bluray-fallback-check-script
  namespace: apps
data:
  check.py: |
    import json
    import os
    import urllib.request
    from datetime import datetime, timezone, timedelta

    RADARR_HOST = "radarr-svc.apps.svc.cluster.local"
    RADARR_PORT = 7878
    RADARR_API_KEY = os.environ["RADARR_API_KEY"]

    STRICT_PROFILE_NAME = "Bluray"
    FALLBACK_PROFILE_NAME = "Bluray or WebDL (fallback)"
    WAIT_DAYS = 7
    STATE_PATH = "/state/.bluray-fallback-state.json"

    BLURAY_QUALITY_MARKERS = ("Bluray", "Remux", "BR-DISK")


    def api(method, path, body=None):
        url = f"http://{RADARR_HOST}:{RADARR_PORT}{path}"
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method, headers={
            "X-Api-Key": RADARR_API_KEY,
            "Content-Type": "application/json",
        })
        with urllib.request.urlopen(req, timeout=30) as resp:
            raw = resp.read()
            return json.loads(raw) if raw else None


    def load_state():
        try:
            with open(STATE_PATH) as f:
                return json.load(f)
        except FileNotFoundError:
            return {}


    def save_state(state):
        os.makedirs(os.path.dirname(STATE_PATH), exist_ok=True)
        with open(STATE_PATH, "w") as f:
            json.dump(state, f, indent=2, sort_keys=True)


    def is_bluray_quality(name):
        return bool(name) and any(marker in name for marker in BLURAY_QUALITY_MARKERS)


    profiles = api("GET", "/api/v3/qualityprofile")
    strict_id = next(p["id"] for p in profiles if p["name"] == STRICT_PROFILE_NAME)
    fallback_id = next(p["id"] for p in profiles if p["name"] == FALLBACK_PROFILE_NAME)

    movies = api("GET", "/api/v3/movie")
    now = datetime.now(timezone.utc)
    state = load_state()
    # state["waiting_strict"][id]: when we first saw this movie stuck on the strict
    #   profile -- after WAIT_DAYS we switch it to the fallback profile.
    # state["waiting_fallback"][id]: when we last (re-)searched this movie while it
    #   sits on the fallback profile below cutoff -- every WAIT_DAYS we search again,
    #   since Radarr's RSS sync only catches newly-published releases, not older
    #   Bluray/Remux releases indexed before the movie was last searched.
    waiting_strict = state.setdefault("waiting_strict", {})
    waiting_fallback = state.setdefault("waiting_fallback", {})
    seen_strict, seen_fallback = set(), set()
    started, switched, researched, cleaned = [], [], [], []

    for movie in movies:
        current_quality = (movie.get("movieFile") or {}).get("quality", {}).get("quality", {}).get("name", "")
        if is_bluray_quality(current_quality):
            continue

        movie_id = str(movie["id"])
        profile_id = movie.get("qualityProfileId")

        if profile_id == strict_id:
            seen_strict.add(movie_id)

            if movie_id not in waiting_strict:
                waiting_strict[movie_id] = now.isoformat()
                started.append(movie["title"])
                continue

            first_seen = datetime.fromisoformat(waiting_strict[movie_id])
            if now - first_seen >= timedelta(days=WAIT_DAYS):
                api("PUT", f"/api/v3/movie/{movie_id}", {**movie, "qualityProfileId": fallback_id})
                api("POST", "/api/v3/command", {"name": "MoviesSearch", "movieIds": [movie["id"]]})
                switched.append(movie["title"])
                del waiting_strict[movie_id]
                waiting_fallback[movie_id] = now.isoformat()

        elif profile_id == fallback_id:
            seen_fallback.add(movie_id)

            if movie_id not in waiting_fallback:
                # Just switched (or manually put) on the fallback profile --
                # it was already searched at switch time, so start the clock now.
                waiting_fallback[movie_id] = now.isoformat()
                continue

            last_searched = datetime.fromisoformat(waiting_fallback[movie_id])
            if now - last_searched >= timedelta(days=WAIT_DAYS):
                api("POST", "/api/v3/command", {"name": "MoviesSearch", "movieIds": [movie["id"]]})
                researched.append(movie["title"])
                waiting_fallback[movie_id] = now.isoformat()

    # Drop tracking for anything no longer pending on the profile we tracked it
    # under (upgraded to Bluray already, or profile changed manually).
    for movie_id in list(waiting_strict):
        if movie_id not in seen_strict:
            cleaned.append(movie_id)
            del waiting_strict[movie_id]
    for movie_id in list(waiting_fallback):
        if movie_id not in seen_fallback:
            cleaned.append(movie_id)
            del waiting_fallback[movie_id]

    save_state(state)

    print(f"Started tracking {len(started)} movie(s) newly stuck on strict profile: {started}")
    print(f"Switched {len(switched)} movie(s) to fallback profile after {WAIT_DAYS}d: {switched}")
    print(f"Re-searched {len(researched)} movie(s) still on fallback profile after {WAIT_DAYS}d: {researched}")
    print(f"Cleaned up {len(cleaned)} stale tracking entr(y/ies).")
    print(f"Currently tracking {len(waiting_strict)} on strict profile, {len(waiting_fallback)} on fallback profile.")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bluray-fallback-check
  namespace: apps
spec:
  schedule: "0 10 * * *" # 10 AM daily
  timeZone: "America/New_York"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: bluray-fallback-check
            image: python:3.12-alpine
            command: ["python", "/scripts/check.py"]
            env:
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-api-keys
                  key: RADARR_API_KEY
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: state
              mountPath: /state
          restartPolicy: OnFailure
          volumes:
          - name: script
            configMap:
              name: bluray-fallback-check-script
          - name: state
            persistentVolumeClaim:
              claimName: nfs-media-pvc
