apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overseerr-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path 
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overseerr
  namespace: apps
  labels:
    app: overseerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overseerr
  strategy:
    type: Recreate 
  template:
    metadata:
      labels:
        app: overseerr
    spec:
      nodeSelector:
        kubernetes.io/hostname: tars
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: overseerr
          # Pinned instead of :latest (tars#61) - v3.4.1 fixes CVE-2026-73291
          # (path traversal -> RCE in the image proxy). Note: it does NOT yet
          # include the Next.js fix for GHSA-2xp9-vwfh-vxw4 (AVIF decode RCE,
          # fixed upstream in Next.js 16.3.3+) - seerr is still on Next.js
          # 16.2.6 as of this tag; the bump (seerr-team/seerr#3150) is still
          # an open PR, not merged. Re-check once it lands and ships in a tag.
          image: ghcr.io/seerr-team/seerr:v3.4.1
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: overseerr-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: overseerr-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: overseerr
  ports:
    - protocol: TCP
      port: 5055
      targetPort: 5055
