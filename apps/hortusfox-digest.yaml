apiVersion: v1
kind: ConfigMap
metadata:
  name: hortusfox-digest-script
  namespace: apps
data:
  digest.py: |
    import json
    import os
    import smtplib
    import ssl
    import urllib.request
    import urllib.parse
    from email.mime.text import MIMEText
    from datetime import date, datetime

    HORTUSFOX_URL = os.environ["HORTUSFOX_URL"]
    HORTUSFOX_TOKEN = os.environ["HORTUSFOX_TOKEN"]
    SMTP_HOST = os.environ.get("SMTP_HOST", "smtp.gmail.com")
    SMTP_PORT = int(os.environ.get("SMTP_PORT", "587"))
    SMTP_USERNAME = os.environ["SMTP_USERNAME"]
    SMTP_PASSWORD = os.environ["SMTP_PASSWORD"]
    MAIL_TO = os.environ["MAIL_TO"]

    data = urllib.parse.urlencode({
        "token": HORTUSFOX_TOKEN,
        "done": "false",
        "limit": "200",
    }).encode()
    req = urllib.request.Request(f"{HORTUSFOX_URL}/api/tasks/fetch", data=data, method="POST")
    with urllib.request.urlopen(req, timeout=15) as resp:
        body = json.loads(resp.read().decode())

    tasks = body.get("data") or []
    today = date.today()
    due = []

    for t in tasks:
        due_date_str = t.get("due_date")
        if not due_date_str:
            continue
        try:
            due_date = datetime.strptime(due_date_str[:10], "%Y-%m-%d").date()
        except ValueError:
            continue
        if due_date <= today:
            due.append((due_date, t))

    due.sort(key=lambda x: x[0])

    if not due:
        print("No tasks due today or overdue. Skipping email.")
    else:
        lines = []
        for due_date, t in due:
            tag = "OVERDUE" if due_date < today else "TODAY"
            lines.append(f"[{tag}] {t['title']} (due {due_date.isoformat()})")

        body_text = (
            "Plant care tasks needing attention:\n\n"
            + "\n".join(lines)
            + f"\n\nView all: {HORTUSFOX_URL}/tasks"
        )

        msg = MIMEText(body_text)
        msg["Subject"] = f"HortusFox: {len(due)} plant task(s) due"
        msg["From"] = SMTP_USERNAME
        msg["To"] = MAIL_TO

        context = ssl.create_default_context()
        with smtplib.SMTP(SMTP_HOST, SMTP_PORT) as server:
            server.starttls(context=context)
            server.login(SMTP_USERNAME, SMTP_PASSWORD)
            server.sendmail(SMTP_USERNAME, [MAIL_TO], msg.as_string())

        print(f"Sent digest with {len(due)} task(s).")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hortusfox-daily-digest
  namespace: apps
spec:
  schedule: "0 7 * * *" # 7 AM daily
  timeZone: "America/New_York"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hortusfox-digest
            image: python:3.12-alpine
            command: ["python", "/scripts/digest.py"]
            env:
            - name: HORTUSFOX_URL
              value: "http://hortusfox-svc.apps.svc.cluster.local:8081"
            - name: HORTUSFOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hortusfox-secrets
                  key: HORTUSFOX_API_TOKEN
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USERNAME
              value: "ehulle117@gmail.com"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-auth
                  key: password
            - name: MAIL_TO
              value: "ehulle117@gmail.com"
            volumeMounts:
            - name: script
              mountPath: /scripts
          restartPolicy: OnFailure
          volumes:
          - name: script
            configMap:
              name: hortusfox-digest-script
