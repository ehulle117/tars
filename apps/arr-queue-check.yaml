apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-queue-check-script
  namespace: apps
data:
  check.py: |
    import json
    import os
    import urllib.request
    from datetime import datetime, timezone

    STUCK_STATES = {"importPending", "importFailed", "failed"}
    STUCK_AGE_HOURS = 24

    APPS = [
        {"name": "Radarr", "host": "radarr-svc.apps.svc.cluster.local", "port": 7878, "api": "v3", "key": os.environ["RADARR_API_KEY"]},
        {"name": "Sonarr", "host": "sonarr-svc.apps.svc.cluster.local", "port": 8989, "api": "v3", "key": os.environ["SONARR_API_KEY"]},
        {"name": "Lidarr", "host": "lidarr-svc.apps.svc.cluster.local", "port": 8686, "api": "v1", "key": os.environ["LIDARR_API_KEY"]},
        {"name": "Readarr", "host": "readarr-svc.apps.svc.cluster.local", "port": 8787, "api": "v1", "key": os.environ["READARR_API_KEY"]},
    ]

    PROWLARR_HOST = "prowlarr-svc.apps.svc.cluster.local"
    PROWLARR_PORT = 9696
    PROWLARR_KEY = os.environ["PROWLARR_API_KEY"]
    INDEXER_STALE_DAYS = 3


    def api_get(host, port, path, api_key, timeout=15):
        req = urllib.request.Request(f"http://{host}:{port}{path}", headers={"X-Api-Key": api_key})
        with urllib.request.urlopen(req, timeout=timeout) as resp:
            return json.loads(resp.read().decode())


    def hours_since(iso_ts):
        added = datetime.fromisoformat(iso_ts.replace("Z", "+00:00"))
        return (datetime.now(timezone.utc) - added).total_seconds() / 3600


    # sections: list of {"app": str, "stuck": [...], "health": [...], "error": str|None}
    sections = []
    prowlarr_stale = []
    prowlarr_error = None

    for app in APPS:
        section = {"app": app["name"], "stuck": [], "health": [], "error": None}
        sections.append(section)

        try:
            queue = api_get(app["host"], app["port"], f"/api/{app['api']}/queue?pageSize=100", app["key"])
        except Exception as e:
            section["error"] = f"couldn't fetch queue: {e}"
            continue

        for rec in queue.get("records", []):
            state = rec.get("trackedDownloadState")
            if state not in STUCK_STATES:
                continue
            age_h = hours_since(rec["added"]) if rec.get("added") else 0
            if age_h < STUCK_AGE_HOURS:
                continue
            msgs = rec.get("statusMessages") or []
            err = "; ".join(m.get("title", "") for m in msgs) or state
            section["stuck"].append({
                "title": rec.get("title", "unknown"),
                "indexer": rec.get("indexer", "unknown"),
                "age_h": age_h,
                "state": state,
                "error": err,
            })

        try:
            health = api_get(app["host"], app["port"], f"/api/{app['api']}/health", app["key"])
        except Exception as e:
            section["error"] = f"couldn't fetch health: {e}"
            continue

        for h in health:
            if h.get("type") in ("warning", "error"):
                section["health"].append({"level": h["type"], "message": h.get("message", "")})

    try:
        statuses = api_get(PROWLARR_HOST, PROWLARR_PORT, "/api/v1/indexerstatus", PROWLARR_KEY)
        indexers = {i["id"]: i["name"] for i in api_get(PROWLARR_HOST, PROWLARR_PORT, "/api/v1/indexer", PROWLARR_KEY)}
        for s in statuses:
            initial = s.get("initialFailure")
            if not initial:
                continue
            days = hours_since(initial) / 24
            if days >= INDEXER_STALE_DAYS:
                prowlarr_stale.append({
                    "name": indexers.get(s["indexerId"], f"id={s['indexerId']}"),
                    "since": initial[:10],
                    "days": days,
                })
    except Exception as e:
        prowlarr_error = str(e)

    has_issues = (
        any(s["stuck"] or s["health"] or s["error"] for s in sections)
        or prowlarr_stale
        or prowlarr_error
    )

    if not has_issues:
        print("All queues clean, no long-term indexer failures. Skipping.")
    else:
        issue_count = sum(len(s["stuck"]) + len(s["health"]) + (1 if s["error"] else 0) for s in sections)
        issue_count += len(prowlarr_stale) + (1 if prowlarr_error else 0)

        text_lines = [f"Morning *arr stack check: {issue_count} issue(s) found\n"]
        for section in sections:
            if not (section["stuck"] or section["health"] or section["error"]):
                continue
            text_lines.append(f"[{section['app']}]")
            if section["error"]:
                text_lines.append(f"  ERROR: {section['error']}")
            for item in section["stuck"]:
                text_lines.append(
                    f"  - {item['title']} [{item['indexer']}] stuck {item['age_h']:.0f}h "
                    f"({item['state']}): {item['error']}"
                )
            for h in section["health"]:
                text_lines.append(f"  {h['level'].upper()}: {h['message']}")
            text_lines.append("")
        if prowlarr_stale or prowlarr_error:
            text_lines.append("[Prowlarr]")
            if prowlarr_error:
                text_lines.append(f"  ERROR: couldn't fetch indexer status: {prowlarr_error}")
            for idx in prowlarr_stale:
                text_lines.append(f"  - {idx['name']}: failing since {idx['since']} ({idx['days']:.0f} days)")
        text_body = "\n".join(text_lines)

        print(f"Found {issue_count} issue(s), queuing for Claude triage.")

        # Drop a copy for pod-health-check to drain and triage via
        # Claude/gh - this job can't co-locate with the Claude config PVC
        # (no need to add a nodeSelector just for this). pod-health-check
        # posts the triaged result to Discord (ARR_QUEUE_CHANNEL_ID via the
        # Tars bot) - see "Claude-triaged alerts" in the repo README.
        queue_dir = "/queue/.tars-triage-queue"
        os.makedirs(queue_dir, exist_ok=True)
        stamp = datetime.now().strftime("%Y%m%d%H%M%S")
        with open(f"{queue_dir}/arr-queue-check-{stamp}.txt", "w") as f:
            f.write(text_body)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-queue-check
  namespace: apps
spec:
  schedule: "0 8 * * *" # 8 AM daily
  timeZone: "America/New_York"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: arr-queue-check
            image: python:3.12-alpine
            command: ["python", "/scripts/check.py"]
            env:
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-api-keys
                  key: RADARR_API_KEY
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-api-keys
                  key: SONARR_API_KEY
            - name: LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-api-keys
                  key: LIDARR_API_KEY
            - name: READARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-api-keys
                  key: READARR_API_KEY
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-api-keys
                  key: PROWLARR_API_KEY
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: triage-queue
              mountPath: /queue
          restartPolicy: OnFailure
          volumes:
          - name: script
            configMap:
              name: arr-queue-check-script
          - name: triage-queue
            persistentVolumeClaim:
              claimName: nfs-media-pvc
