apiVersion: batch/v1
kind: CronJob
metadata:
  name: case-worker-appdata-backup
  namespace: apps
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  schedule: "15 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: k3s-worker-case
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - |
                  run() {
                    set -e
                    echo "Starting backup of k3s local-path storage on k3s-worker-case..."
                    DATE=$(date +%Y-%m-%d_%H-%M-%S)
                    mkdir -p /destination/case_worker_k8s_appdata
                    tar -czf /destination/case_worker_k8s_appdata/backup_${DATE}.tar.gz -C /source .
                    echo "Backup completed successfully: backup_${DATE}.tar.gz"
                    echo "Cleaning up backups older than 7 days..."
                    find /destination/case_worker_k8s_appdata -name "backup_*.tar.gz" -mtime +7 -delete
                    echo "Cleanup complete."
                  }
                  if ! run; then
                    wget -q -O- --header="Content-Type: application/json" \
                      --post-data="{\"content\": \"**case-worker-appdata-backup failed** on host k3s-worker-case\"}" \
                      "$DISCORD_WEBHOOK_URL" >/dev/null 2>&1
                    mkdir -p /destination/.tars-triage-queue
                    echo "case-worker-appdata-backup (host k3s-worker-case) failed at $(date -Iseconds). Check: kubectl logs -n apps pod/$HOSTNAME" \
                      > "/destination/.tars-triage-queue/case-worker-appdata-backup-$(date +%Y%m%d%H%M%S).txt"
                    exit 1
                  fi
                  wget -q -O- "$KUMA_PUSH_URL" >/dev/null 2>&1
              env:
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: discord-alerts
                      key: webhook_url
                - name: KUMA_PUSH_URL
                  valueFrom:
                    secretKeyRef:
                      name: uptime-kuma-push
                      key: case_worker_appdata_backup_url
              volumeMounts:
                - name: source-data
                  mountPath: /source
                  readOnly: true
                - name: destination-data
                  mountPath: /destination
          volumes:
            - name: source-data
              hostPath:
                path: /var/lib/rancher/k3s/storage
                type: Directory
            - name: destination-data
              persistentVolumeClaim:
                claimName: nfs-media-pvc
