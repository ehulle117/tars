apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-health-checker
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-health-checker
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-health-checker
subjects:
  - kind: ServiceAccount
    name: cluster-health-checker
    namespace: apps
roleRef:
  kind: ClusterRole
  name: cluster-health-checker
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-health-check-script
  namespace: apps
data:
  check.py: |
    import json
    import os
    import re
    import ssl
    import subprocess
    import urllib.request
    from datetime import datetime, timezone

    with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
        TOKEN = f.read().strip()
    with open("/var/run/secrets/kubernetes.io/serviceaccount/ca.crt", "rb") as f:
        CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

    API = "https://kubernetes.default.svc"

    PENDING_MINUTES_THRESHOLD = 15
    RESTART_COUNT_THRESHOLD = 5
    RECENT_RESTART_WINDOW_MINUTES = 24 * 60
    BAD_WAITING_REASONS = {"CrashLoopBackOff", "ImagePullBackOff", "ErrImagePull", "CreateContainerConfigError", "InvalidImageName"}

    ctx = ssl.create_default_context(cafile=CA_PATH)


    def api_get(path):
        req = urllib.request.Request(f"{API}{path}", headers={"Authorization": f"Bearer {TOKEN}"})
        with urllib.request.urlopen(req, timeout=15, context=ctx) as resp:
            return json.loads(resp.read().decode())


    def minutes_since(iso_ts):
        ts = datetime.fromisoformat(iso_ts.replace("Z", "+00:00"))
        return (datetime.now(timezone.utc) - ts).total_seconds() / 60


    pods = api_get("/api/v1/pods")["items"]

    issues = []

    for pod in pods:
        ns = pod["metadata"]["namespace"]
        name = pod["metadata"]["name"]
        phase = pod["status"].get("phase")
        full = f"{ns}/{name}"

        if phase == "Unknown":
            issues.append(f"`{full}` in Unknown state")
            continue

        # A crashlooping/image-pull-failing pod is always phase=Pending (its
        # container never reaches Running), so bad waiting reasons must be
        # checked before any Pending-specific handling - otherwise a pod
        # crashlooping for under PENDING_MINUTES_THRESHOLD is invisible here.
        has_bad_reason = False
        for cs in pod["status"].get("containerStatuses", []):
            waiting = cs.get("state", {}).get("waiting")
            if waiting and waiting.get("reason") in BAD_WAITING_REASONS:
                issues.append(f"`{full}` container `{cs['name']}`: {waiting['reason']} - {waiting.get('message', '')[:120]}")
                has_bad_reason = True

            # Only alert on a restart-based condition if the most recent
            # restart was actually recent - restartCount never resets on its
            # own, so without this a pod that restarted once, weeks ago,
            # would re-trigger an identical alert on every single run forever.
            terminated = cs.get("lastState", {}).get("terminated")
            finished_at = terminated.get("finishedAt") if terminated else None
            recent_restart = finished_at and minutes_since(finished_at) <= RECENT_RESTART_WINDOW_MINUTES

            if terminated and terminated.get("reason") == "OOMKilled" and recent_restart:
                issues.append(f"`{full}` container `{cs['name']}`: OOMKilled {minutes_since(finished_at):.0f}m ago")

            if cs.get("restartCount", 0) >= RESTART_COUNT_THRESHOLD and recent_restart:
                issues.append(
                    f"`{full}` container `{cs['name']}`: {cs['restartCount']} restarts, "
                    f"most recently {minutes_since(finished_at):.0f}m ago"
                )

        if phase == "Pending" and not has_bad_reason:
            created = pod["metadata"].get("creationTimestamp")
            if created and minutes_since(created) >= PENDING_MINUTES_THRESHOLD:
                issues.append(f"`{full}` stuck Pending for {minutes_since(created):.0f}m")

    # Other jobs that can't co-locate with the Claude config PVC (different
    # node, or no PVC mount at all) drop a small text file here instead of
    # triaging themselves - this run drains it alongside its own findings so
    # all Claude/gh work happens in one place. Consumed only after a
    # successful triage+post below, so a failed run leaves files for retry.
    QUEUE_DIR = "/queue/.tars-triage-queue"
    queued_files = []
    if os.path.isdir(QUEUE_DIR):
        for fname in sorted(os.listdir(QUEUE_DIR)):
            fpath = os.path.join(QUEUE_DIR, fname)
            with open(fpath) as f:
                content = f.read().strip()
            if content:
                issues.append(f"[from {fname}]\n{content}")
            queued_files.append(fpath)

    if not issues:
        print("All pods healthy. Skipping Discord notification.")
    else:
        raw_findings = "\n".join(f"- {i}" for i in issues[:25])

        # Bootstrap Claude Code + gh CLI only when there's actually something
        # to triage - the common "all healthy" case above never pays this cost.
        subprocess.run(["sh", "-c",
            "apk add --no-cache nodejs npm bash curl tar && "
            "npm install -g @anthropic-ai/claude-code && "
            "GH_VERSION=$(curl -s https://api.github.com/repos/cli/cli/releases/latest | "
            "  grep tag_name | cut -d'\"' -f4 | tr -d v) && "
            "curl -L -o /tmp/gh.tar.gz https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz && "
            "tar -xzf /tmp/gh.tar.gz -C /tmp && "
            "install -m 0755 /tmp/gh_${GH_VERSION}_linux_amd64/bin/gh /usr/local/bin/gh && "
            # Same fix as the claude-code dev pod (apps/claude-code.yaml): auth
            # config lives at ~/.claude.json, outside the mounted ~/.claude/
            # dir, so it's symlinked to the copy the dev pod already persisted.
            "[ -e /root/.claude.json ] && [ ! -L /root/.claude.json ] && mv /root/.claude.json /root/.claude/claude.json; "
            "ln -sf /root/.claude/claude.json /root/.claude.json"
        ], check=True, timeout=180)

        repo = os.environ["GITHUB_REPO"]
        prompt = (
            "You are triaging a finding from the tars cluster's pod-health-check "
            "(runs every 15 minutes; this only fires when it finds something):\n\n"
            f"{raw_findings}\n\n"
            f'Use `gh issue list --repo {repo} --state open --search "<keywords>"` '
            "to check whether an open issue already tracks this. Then:\n"
            "- If it's a genuine, actionable problem with NO existing matching issue: open one with "
            f'`gh issue create --repo {repo} --title "..." --body "..."`.\n'
            "- If it's a genuine problem that already HAS a matching open issue: add a short comment "
            f'with `gh issue comment <number> --repo {repo} --body "..."` noting '
            "it's still occurring, rather than opening a duplicate.\n"
            "- If it's not actually worth tracking (transient, already resolving, etc.): do nothing on GitHub.\n\n"
            "Your FINAL response must be exactly one short line of Discord-ready plain text summarizing "
            f'what you did (e.g. "Opened {repo}#12: ..." or "Commented on '
            f'{repo}#12 (still occurring)" or "Not tracked - looks transient: ...").\n'
            "No other commentary before or after it."
        )

        result = subprocess.run(
            ["claude", "-p", prompt, "--allowedTools", "Bash(gh *)"],
            capture_output=True, text=True, timeout=180, check=True,
        )
        message = result.stdout.strip() or raw_findings

        # Tracked-issue triage results go to a Discord Forum channel, not the
        # regular alerts text channel - forum webhooks require thread_name to
        # create a new post per message. ?wait=true makes Discord return the
        # created message (incl. channel_id, the new thread's id) instead of
        # firing-and-forgetting, so a newly-opened issue's thread can be
        # found again later to post a resolved notice.
        thread_name = f"pod-health-check: {message[:80]}"
        # Discord's edge blocks Python urllib's TLS/HTTP fingerprint with a 403;
        # shelling out to busybox wget (present in python:3.12-alpine) avoids it.
        post = subprocess.run(
            ["wget", "-q", "-O-", "--header=Content-Type: application/json",
             "--post-data", json.dumps({"content": message, "thread_name": thread_name}),
             os.environ["TRACKED_ISSUES_WEBHOOK_URL"] + "?wait=true"],
            check=True, timeout=15, capture_output=True, text=True,
        )
        print(f"Posted {len(issues)} issue(s), triaged: {message}")

        # If Claude opened a new issue, stash this thread's id in the issue
        # body (invisible HTML comment) so a GitHub Actions workflow can find
        # it again and post a "Resolved" notice into the same thread when
        # the issue closes - see .github/workflows/issue-closed-notify.yml.
        opened = re.search(rf"Opened {re.escape(repo)}#(\d+)", message)
        if opened:
            try:
                thread_id = json.loads(post.stdout)["channel_id"]
                issue_num = opened.group(1)
                current_body = subprocess.run(
                    ["gh", "issue", "view", issue_num, "--repo", repo, "--json", "body", "-q", ".body"],
                    capture_output=True, text=True, timeout=30, check=True,
                ).stdout
                subprocess.run(
                    ["gh", "issue", "edit", issue_num, "--repo", repo, "--body",
                     f"{current_body}\n\n<!-- discord_thread_id: {thread_id} -->"],
                    check=True, timeout=30,
                )
            except Exception as e:
                print(f"Couldn't stash Discord thread id on the new issue (non-fatal): {e}")

        for fpath in queued_files:
            os.remove(fpath)

    # Heartbeat to Uptime Kuma so a crashed/never-ran job (which wouldn't reach
    # this line) shows as down, instead of failing silently.
    subprocess.run(["wget", "-q", "-O-", os.environ["KUMA_PUSH_URL"]], check=True, timeout=15)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-health-check
  namespace: apps
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: cluster-health-checker
          restartPolicy: OnFailure
          # Co-located with the claude-code dev pod's config PVC (below) so
          # triage can reuse its existing Claude Code login - no separate
          # Anthropic API key/billing.
          nodeSelector:
            kubernetes.io/hostname: k3s-worker-case
          containers:
          - name: pod-health-check
            image: python:3.12-alpine
            command: ["python", "/scripts/check.py"]
            env:
            - name: TRACKED_ISSUES_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-alerts
                  key: tracked_issues_webhook_url
            - name: KUMA_PUSH_URL
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-push
                  key: pod_health_check_url
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: token
            - name: GITHUB_REPO
              value: "ehulle117/tars"
            - name: HOME
              value: "/root"
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: claude-config
              mountPath: /root/.claude
            - name: triage-queue
              mountPath: /queue
          volumes:
          - name: script
            configMap:
              name: pod-health-check-script
          - name: claude-config
            persistentVolumeClaim:
              claimName: claude-code-config-pvc
          - name: triage-queue
            persistentVolumeClaim:
              claimName: nfs-media-pvc
