apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readarr-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path 
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr
  namespace: apps
  labels:
    app: readarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readarr
  strategy:
    type: Recreate 
  template:
    metadata:
      labels:
        app: readarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: tars
      containers:
        - name: readarr
          # Bookshelf: maintained Readarr fork (Readarr upstream is archived and its
          # metadata server is dead). softcover = Goodreads metadata, the only
          # variant compatible with the existing Readarr DB. Upgrades the DB in
          # place - rolling back means restoring /config from the appdata backup.
          image: ghcr.io/pennydreadful/bookshelf:softcover-v0.4.21.182@sha256:23defe59522d0591ade31b2a59c674648f43be47fae769d93d32bb1e038c7170
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
          ports:
            - containerPort: 8787
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
            - name: media
              mountPath: /media
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: readarr-config-pvc
        - name: media
          persistentVolumeClaim:
            claimName: nfs-media-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: deluge-downloads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: readarr-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: readarr
  ports:
    - protocol: TCP
      port: 8787
      targetPort: 8787
