# qBittorrent behind a Gluetun VPN sidecar - replacement for deluge.yaml
# (binhex arch-delugevpn). Phase 1 of the migration: runs alongside Deluge,
# nothing points at it yet.
#
# Why Gluetun: binhex's VPN scripts broke when PIA renamed its servers
# (*.privacy.network -> *.pvt.site, 2026-11-20) and Deluge never started
# (tars#195). Gluetun keeps its own PIA server list and refreshes it
# (UPDATER_PERIOD), handles PIA port forwarding itself, and pushes the
# forwarded port into qBittorrent.
#
# Layout matches Deluge so the *arr imports need no path mappings: same
# deluge-downloads-pvc at /downloads, completed torrents in
# /downloads/complete/<category>, in-progress in /downloads/qbit-incomplete
# (kept apart from Deluge's in-progress files while both run).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-config-init
  namespace: apps
data:
  init.py: |
    # Enforces the settings this deployment depends on before qBittorrent
    # starts (runs every pod start; qBittorrent fills in everything else on
    # first run). WebUI login comes from the qbittorrent-auth secret.
    import base64, configparser, hashlib, json, os

    conf_dir = "/config/qBittorrent"
    conf = f"{conf_dir}/qBittorrent.conf"
    os.makedirs(conf_dir, exist_ok=True)

    cp = configparser.ConfigParser(interpolation=None, strict=False)
    cp.optionxform = str  # qBittorrent keys are case-sensitive
    cp.read(conf)

    def put(section, key, value):
        if not cp.has_section(section):
            cp.add_section(section)
        cp.set(section, key, value)

    salt = os.urandom(16)
    dk = hashlib.pbkdf2_hmac("sha512", os.environ["QB_PASS"].encode(), salt, 100000, 64)
    pw = f'"@ByteArray({base64.b64encode(salt).decode()}:{base64.b64encode(dk).decode()})"'

    settings = {
        "Preferences": {
            "WebUI\\Port": "8090",
            "WebUI\\Username": os.environ["QB_USER"],
            "WebUI\\Password_PBKDF2": pw,
            # Gluetun's port-forward hook calls the API from 127.0.0.1.
            "WebUI\\LocalHostAuth": "false",
            # Reached as qbittorrent-svc, by IP, and via NPM (qbit.tars.local).
            "WebUI\\HostHeaderValidation": "false",
        },
        "BitTorrent": {
            "Session\\DefaultSavePath": "/downloads/complete",
            "Session\\TempPathEnabled": "true",
            "Session\\TempPath": "/downloads/qbit-incomplete",
            # Category save paths (below) only apply with automatic torrent
            # management, which the *arrs rely on.
            "Session\\DisableAutoTMMByDefault": "false",
            # Bind to the VPN tunnel only - belt and braces on top of
            # Gluetun's kill-switch firewall.
            "Session\\Interface": "tun0",
            "Session\\InterfaceName": "tun0",
            # Stop seeding after 30 days (replaces deluge-seed-cap).
            "Session\\GlobalMaxSeedingMinutes": "43200",
            "Session\\ShareLimitAction": "Stop",
        },
    }
    for section, kv in settings.items():
        for k, v in kv.items():
            put(section, k, v)
    with open(conf, "w") as f:
        cp.write(f, space_around_delimiters=False)

    cats = f"{conf_dir}/categories.json"
    try:
        current = json.load(open(cats))
    except (OSError, ValueError):
        current = {}
    for c in ("tv", "movies", "music", "ebooks"):
        current.setdefault(c, {})["save_path"] = f"/downloads/complete/{c}"
    json.dump(current, open(cats, "w"), indent=2)

    for root, dirs, files in os.walk("/config"):
        for p in [root] + [os.path.join(root, x) for x in files]:
            os.chown(p, 1000, 1000)
    print("qBittorrent config enforced")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: apps
  labels:
    app: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: tars
      # All DNS goes to Gluetun's resolver (DNS over TLS through the tunnel),
      # not kube-dns, so tracker lookups don't leak outside the VPN.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["127.0.0.1"]
      initContainers:
        - name: config-init
          image: python:3.12-alpine
          command: ["python", "/scripts/init.py"]
          env:
            - name: QB_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-auth
                  key: user
            - name: QB_PASS
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-auth
                  key: pass
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-init
              mountPath: /scripts
        # Native sidecar: starts before qBittorrent, and qBittorrent only
        # starts once the startupProbe sees the tunnel healthy.
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - containerPort: 8888
              name: httpproxy
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: VPN_TYPE
              value: "openvpn"
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: vpn-auth
                  key: user
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpn-auth
                  key: pass
            # Closest port-forwarding regions to tars (TCP connect 40/43 ms
            # vs 82 ms for the old Vancouver endpoint). PIA has no port
            # forwarding on US servers.
            - name: SERVER_REGIONS
              value: "CA Toronto,CA Ontario"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: PORT_FORWARD_ONLY
              value: "on"
            # Push the forwarded port into qBittorrent whenever PIA assigns
            # one. qBittorrent may still be starting on the first call, hence
            # the retry loop.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'for i in $(seq 60); do
                wget -qO- --post-data "json={\"listen_port\":{{PORT}}}"
                http://127.0.0.1:8090/api/v2/app/setPreferences && exit 0;
                sleep 5; done; exit 1'
            # Refresh the PIA server list daily so a rename like 2026-11-20's
            # doesn't strand us on a stale list.
            - name: UPDATER_PERIOD
              value: "24h"
            # HTTP proxy for Prowlarr (replaces Deluge's Privoxy on 8118).
            - name: HTTPPROXY
              value: "on"
            - name: HTTPPROXY_LISTENING_ADDRESS
              value: ":8888"
            # Allow in-cluster/LAN clients to reach the web UI and proxy.
            - name: FIREWALL_INPUT_PORTS
              value: "8090,8888"
            - name: TZ
              value: "America/New_York"
          startupProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            # Gluetun restarts the tunnel itself when it goes unhealthy; this
            # only restarts the container if that stays broken for ~10 min.
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 10
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent:5.3.0_v2.1.2-ls487@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
          ports:
            - containerPort: 8090
              name: web
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
            - name: WEBUI_PORT
              value: "8090"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
          livenessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        - name: config-init
          configMap:
            name: qbittorrent-config-init
        - name: downloads
          persistentVolumeClaim:
            claimName: deluge-downloads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-svc
  namespace: apps
spec:
  # In-cluster: the *arr apps (web API) and Prowlarr (HTTP proxy).
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - name: web
      protocol: TCP
      port: 8090
      targetPort: 8090
    - name: httpproxy
      protocol: TCP
      port: 8888
      targetPort: 8888
---
# Only the web UI is published on the LAN (NPM: qbit.tars.local -> tars:8090).
# The proxy stays in-cluster.
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-web-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: qbittorrent
  ports:
    - name: web
      protocol: TCP
      port: 8090
      targetPort: 8090
