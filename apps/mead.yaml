apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mead-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mead
  namespace: apps
  labels:
    app: mead
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mead
  strategy:
    type: Recreate # SQLite: exactly one writer
  template:
    metadata:
      labels:
        app: mead
    spec:
      # amd64 image; this node's local-path storage is in case-worker-appdata-backup.
      # Moving nodes later strands the local-path PVC: copy mead.db across first.
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-case
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mead
          image: ghcr.io/ehulle117/tars-mead:main
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - containerPort: 8770
          readinessProbe:
            httpGet:
              path: /
              port: 8770
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mead-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mead-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: mead
  ports:
    - protocol: TCP
      port: 8770
      targetPort: 8770
