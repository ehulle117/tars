apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mead-data-tars
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
# Tailscale access for people off the LAN (Gabe): a sidecar joins the tailnet as
# its own device, `homebrew`, and that one device is shared, same as valheim2. See
# docs/mead-tailscale.md for the auth-key secret, the grant and the share.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mead-tailscale
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mead-tailscale
  namespace: apps
rules:
  # Persists the node state so the tailnet identity and IP survive restarts.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mead-tailscale
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: mead-tailscale
    namespace: apps
roleRef:
  kind: Role
  name: mead-tailscale
  apiGroup: rbac.authorization.k8s.io
---
# Port 80 on the tailnet forwards to the app, so shared users don't need ":8770".
# A plain TCP forward, not `serve`'s HTTPS proxy: no tailnet HTTPS certs needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mead-tailscale-serve
  namespace: apps
data:
  serve.json: |
    {"TCP": {"80": {"TCPForward": "127.0.0.1:8770"}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mead
  namespace: apps
  labels:
    app: mead
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mead
  strategy:
    type: Recreate # SQLite: exactly one writer
  template:
    metadata:
      labels:
        app: mead
    spec:
      # amd64 image. Moved off k3s-worker-case 2026-10-16 (that VM is now
      # valheim2-only); mead.db was copied into mead-data-tars first.
      # Moving nodes again strands the local-path PVC: copy mead.db across first.
      nodeSelector:
        kubernetes.io/hostname: tars
      serviceAccountName: mead-tailscale
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mead
          image: ghcr.io/ehulle117/tars-mead:main
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - containerPort: 8770
          readinessProbe:
            httpGet:
              path: /
              port: 8770
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.104.1
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: mead-tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_KUBE_SECRET
              value: mead-tailscale-state
            - name: TS_HOSTNAME
              value: homebrew
            # Userspace mode: tailnet connections reach the app on localhost
            # with no root or NET_ADMIN.
            - name: TS_USERSPACE
              value: "true"
            # tag:game is the tag the valheim nodes already use, so the policy
            # needs no new tagOwners entry.
            - name: TS_EXTRA_ARGS
              value: "--advertise-tags=tag:game"
            - name: TS_SERVE_CONFIG
              value: /serve/serve.json
          volumeMounts:
            - name: tailscale-serve
              mountPath: /serve
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mead-data-tars
        - name: tailscale-serve
          configMap:
            name: mead-tailscale-serve
---
apiVersion: v1
kind: Service
metadata:
  name: mead-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: mead
  ports:
    - protocol: TCP
      port: 8770
      targetPort: 8770
---
# Discord task bot: posts each due task at 6 AM ET; replies (a reading like "1.040 68F", or
# "done") go back into the app over HTTP. Same image as the app. Reuses the Tars bot token —
# no new bot or keys. One replica only, or tasks get posted twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mead-bot
  namespace: apps
  labels:
    app: mead-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mead-bot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mead-bot
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: bot
          image: ghcr.io/ehulle117/tars-mead:main
          imagePullPolicy: Always
          command: ["python", "bot.py"]
          env:
            - name: TZ
              value: "America/New_York"
            - name: MEAD_URL
              value: http://mead-svc.apps.svc.cluster.local:8770
            - name: CHANNEL_ID
              value: "1559709419422490625"
            - name: ALLOWED_USER_IDS
              value: "251566145092452352"
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-alerts
                  key: bot_token
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
