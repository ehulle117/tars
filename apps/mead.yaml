apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mead-data-tars
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mead
  namespace: apps
  labels:
    app: mead
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mead
  strategy:
    type: Recreate # SQLite: exactly one writer
  template:
    metadata:
      labels:
        app: mead
    spec:
      # amd64 image. Moved off k3s-worker-case 2026-10-16 (that VM is now
      # valheim2-only); mead.db was copied into mead-data-tars first.
      # Moving nodes again strands the local-path PVC: copy mead.db across first.
      nodeSelector:
        kubernetes.io/hostname: tars
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mead
          image: ghcr.io/ehulle117/tars-mead:main
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - containerPort: 8770
          readinessProbe:
            httpGet:
              path: /
              port: 8770
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mead-data-tars
---
apiVersion: v1
kind: Service
metadata:
  name: mead-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: mead
  ports:
    - protocol: TCP
      port: 8770
      targetPort: 8770
---
# Discord task bot: posts each due task at 6 AM ET; replies (a reading like "1.040 68F", or
# "done") go back into the app over HTTP. Same image as the app. Reuses the Tars bot token —
# no new bot or keys. One replica only, or tasks get posted twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mead-bot
  namespace: apps
  labels:
    app: mead-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mead-bot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mead-bot
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: bot
          image: ghcr.io/ehulle117/tars-mead:main
          imagePullPolicy: Always
          command: ["python", "bot.py"]
          env:
            - name: TZ
              value: "America/New_York"
            - name: MEAD_URL
              value: http://mead-svc.apps.svc.cluster.local:8770
            - name: CHANNEL_ID
              value: "1559709419422490625"
            - name: ALLOWED_USER_IDS
              value: "251566145092452352"
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-alerts
                  key: bot_token
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
