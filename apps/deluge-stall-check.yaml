apiVersion: v1
kind: ConfigMap
metadata:
  name: deluge-stall-check-script
  namespace: apps
data:
  check.py: |
    import os
    import sys
    from datetime import datetime, timezone

    try:
        from deluge_client import DelugeRPCClient
    except ImportError:
        os.system(f"{sys.executable} -m pip install --quiet deluge-client")
        from deluge_client import DelugeRPCClient

    HOST = os.environ.get("DELUGE_HOST", "deluge-svc.apps.svc.cluster.local")
    PORT = int(os.environ.get("DELUGE_PORT", "58846"))
    USERNAME = os.environ["DELUGE_USERNAME"]
    PASSWORD = os.environ["DELUGE_PASSWORD"]
    STALL_MINUTES = int(os.environ.get("STALL_MINUTES", "120"))
    # A torrent stuck at 0 B/s this long has no seeds/peers coming - removing
    # it (rather than just alerting forever) is what lets Sonarr/Radarr/
    # Lidarr/Readarr notice the download vanished and search for another
    # release instead of the item sitting dead in the queue indefinitely
    # (tars#81: 12 torrents stalled anywhere from 8 to 49 days).
    REMOVE_STALL_HOURS = int(os.environ.get("REMOVE_STALL_HOURS", "72"))
    REMOVE_STALL_MINUTES = REMOVE_STALL_HOURS * 60

    client = DelugeRPCClient(HOST, PORT, USERNAME, PASSWORD, timeout=60)
    client.connect()

    torrents = client.call(
        "core.get_torrents_status",
        {},
        [b"name", b"state", b"download_payload_rate", b"progress", b"time_added", b"tracker_status"],
    )

    now = datetime.now(timezone.utc).timestamp()
    findings = []
    removed = []
    to_remove = []

    for torrent_id, status in torrents.items():
        name = status.get(b"name", torrent_id).decode(errors="replace")
        state = status.get(b"state", b"").decode(errors="replace")
        added = status.get(b"time_added", now)
        age_min = (now - added) / 60
        is_dead_stall = (
            state == "Downloading"
            and status.get(b"download_payload_rate", 0) == 0
            and status.get(b"progress", 0) < 100
            and age_min >= STALL_MINUTES
        )

        if is_dead_stall and age_min >= REMOVE_STALL_MINUTES:
            to_remove.append(torrent_id)
            removed.append(f"{name}: removed after {age_min / 60:.0f}h stalled at {status.get(b'progress', 0):.0f}%")
            continue

        if state == "Error":
            tracker = status.get(b"tracker_status", b"").decode(errors="replace")
            findings.append(f"{name}: Error state ({tracker or 'no tracker message'})")
        elif is_dead_stall:
            findings.append(f"{name}: stalled at {status.get(b'progress', 0):.0f}%, 0 B/s for {age_min:.0f}m+")

    # One core.remove_torrents call, not one core.remove_torrent per torrent -
    # see the matching comment in deluge-local-cleanup.
    if to_remove:
        for tid, err in client.call("core.remove_torrents", to_remove, True):
            findings.append(f"{tid.decode()}: auto-remove failed ({err.decode(errors='replace')})")

    if removed:
        print(f"Removed {len(removed)} torrent(s) stalled {REMOVE_STALL_HOURS}h+:")
        for line in removed:
            print(f"  - {line}")

    if not findings and not removed:
        print("No stalled or errored torrents.")
    elif not findings:
        print("Nothing left to report - all findings were past the removal threshold.")
    else:
        lines = [f"- {f}" for f in findings]
        if removed:
            lines.append("")
            lines.append(f"Also auto-removed {len(removed)} torrent(s) past the {REMOVE_STALL_HOURS}h removal threshold:")
            lines += [f"- {r}" for r in removed]
        text_body = "\n".join(lines)
        print(f"Found {len(findings)} stalled/errored torrent(s), queuing for triage.")

        queue_dir = "/queue/.tars-triage-queue"
        os.makedirs(queue_dir, exist_ok=True)
        stamp = datetime.now().strftime("%Y%m%d%H%M%S")
        with open(f"{queue_dir}/deluge-stall-check-{stamp}.txt", "w") as f:
            f.write(text_body)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deluge-stall-check
  namespace: apps
spec:
  schedule: "41 1-23/2 * * *" # every 2 hours (odd UTC hours, :41)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          containers:
          - name: deluge-stall-check
            image: python:3.12-alpine
            command: ["python", "/scripts/check.py"]
            env:
            - name: DELUGE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: deluge-rpc-auth
                  key: USERNAME
            - name: DELUGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deluge-rpc-auth
                  key: PASSWORD
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: triage-queue
              mountPath: /queue
          restartPolicy: OnFailure
          volumes:
          - name: script
            configMap:
              name: deluge-stall-check-script
          - name: triage-queue
            persistentVolumeClaim:
              claimName: nfs-media-pvc
