apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-downloads-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 750Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge
  namespace: apps
  labels:
    app: deluge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deluge
  strategy:
    type: Recreate 
  template:
    metadata:
      labels:
        app: deluge
    spec:
      nodeSelector:
        kubernetes.io/hostname: tars
      containers:
        - name: deluge
          # 2.2.0-1-04 -> 2.2.0-8-01 (2026-10-23): clears 4 critical pillow CVEs
          # (#158, #163; scans 0 critical) and moves PIA port forwarding to the
          # v2 token API. Pre-upgrade config backup:
          # /config/backups/config-pre-2.2.0-8-01-20261023.tgz
          image: binhex/arch-delugevpn:2.2.0-8-01
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - containerPort: 8112
              name: web
            - containerPort: 58846
              name: daemon
            - containerPort: 58946
              name: bt-tcp
            - containerPort: 58946
              protocol: UDP
              name: bt-udp
            - containerPort: 8118
              name: httpproxy
          env:
            - name: VPN_ENABLED
              value: "yes"
            - name: VPN_PROV
              value: "pia"
            - name: VPN_USER
              valueFrom:
                secretKeyRef:
                  name: vpn-auth
                  key: user
            - name: VPN_PASS
              valueFrom:
                secretKeyRef:
                  name: vpn-auth
                  key: pass
            - name: ENABLE_PRIVOXY
              value: "yes"
            - name: STRICT_PORT_FORWARD
              value: "yes"
            # The image's PIA endpoint resolver also adds Cloudflare IPs
            # (privateinternetaccess.com etc.) to --remote; they never answer
            # on UDP 1198 and each burned the full 60s keepalive, stretching
            # reconnects to 2-6 min. Give up on a dead remote after 10s.
            - name: VPN_OPTIONS
              value: "--server-poll-timeout 10"
            - name: LAN_NETWORK
              value: "10.42.0.0/16,10.43.0.0/16"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
          livenessProbe:
            # arch-delugevpn brings up a tun0 interface once the VPN tunnel
            # is established, then firewalls all torrent traffic if it ever
            # drops - the process/web UI stays "up" either way, so this is
            # the only way to actually detect a dead tunnel and get k8s to
            # restart the pod instead of leaving every torrent stalled
            # (tars#87).
            #
            # Also catches Deluge's other failure mode: the daemon keeps
            # running but every torrent-status RPC hangs forever ("invalid
            # torrent handle used [libtorrent:20]" in the log), which fails
            # every deluge-* CronJob until someone restarts the pod. `info`
            # goes through the same get_torrents_status path that hangs. Only
            # a timeout (exit 124) counts as wedged; a refused connection
            # (still starting up) must not, or startup would restart-loop.
            exec:
              command:
                - sh
                - -c
                - |
                  ip addr show tun0 | grep -q "inet " || exit 1
                  timeout 30 deluge-console -c /config info >/dev/null 2>&1
                  [ $? -ne 124 ]
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 45
            # 6 x 120s (~12 min): rides out routine PIA reconnects, which
            # tripped 3 x 120s and restarted the pod, while still catching a
            # tunnel that stays dead (tars#87).
            failureThreshold: 6
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: deluge-config-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: deluge-downloads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: deluge-svc
  namespace: apps
spec:
  # In-cluster only: the *arr apps and deluge-* CronJobs reach the daemon,
  # web UI and Privoxy by this name. Peers come in over the VPN, not the LAN.
  type: ClusterIP
  selector:
    app: deluge
  ports:
    - name: web
      protocol: TCP
      port: 8112
      targetPort: 8112
    - name: daemon
      protocol: TCP
      port: 58846
      targetPort: 58846
    - name: bittorrent-tcp
      protocol: TCP
      port: 58946
      targetPort: 58946
    - name: bittorrent-udp
      protocol: UDP
      port: 58946
      targetPort: 58946
    - name: httpproxy
      protocol: TCP
      port: 8118
      targetPort: 8118
---
# Only the web UI is published on the LAN (NPM's deluge.tars.local points at
# tars:8112). The daemon RPC port and Privoxy (an open HTTP proxy) used to be
# published on every node IP too.
apiVersion: v1
kind: Service
metadata:
  name: deluge-web-svc
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: deluge
  ports:
    - name: web
      protocol: TCP
      port: 8112
      targetPort: 8112
