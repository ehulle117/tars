<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mead Log{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍯</text></svg>">
<style>
  :root { color-scheme: light dark; --bg: #fbf8f1; --fg: #2a2418; --muted: #7a6f5c; --line: #e4dccb;
          --card: #fff; --accent: #b7791f; --warn: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --fg: #ece5d6; --muted: #a39780; --line: #3a3326; --card: #211d16; --accent: #e0a63e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; align-items: baseline; padding: .9rem 1rem; border-bottom: 1px solid var(--line); }
  header b { font-size: 1.15rem; white-space: nowrap; }
  main { max-width: 980px; margin: 0 auto; padding: 1rem; }
  a { color: var(--accent); }
  h2 { margin: 1.5rem 0 .5rem; font-size: 1.05rem; text-transform: capitalize; }
  section, .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .9rem 1rem; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  .scroll { overflow-x: auto; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: .85rem; }
  td.wrap { white-space: normal; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .next { color: var(--accent); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .5rem; }
  .stats div { padding: .5rem; border: 1px solid var(--line); border-radius: 6px; }
  .stats small { display: block; color: var(--muted); }
  .stats b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  form.row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: end; margin-top: .6rem; }
  label { display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); }
  input, select, textarea, button { font: inherit; padding: .35rem .5rem; border: 1px solid var(--line);
    border-radius: 5px; background: var(--bg); color: var(--fg); }
  input[type=number] { width: 6.5rem; }
  button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
  button.link { background: none; color: var(--muted); padding: 0 .25rem; }
  button.danger { background: var(--warn); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .5rem; }
  .inline { display: inline; }
  .upnext { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .75rem; }
  .task { display: flex; flex-direction: column; gap: .35rem; margin: 0; }
  .task.due { border-color: var(--accent); }
  .task .when { font-size: .8rem; color: var(--muted); }
  .task.due .when { color: var(--accent); font-weight: 600; }
  .task b { font-size: 1.02rem; }
  .badge { font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: .05rem .5rem; white-space: nowrap; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header><b>🍯 Mead Log</b><a href="/">Batches</a><a href="/recipes">Recipes</a><a href="/inventory">Inventory</a><a href="/money">Who paid</a><a href="/calc">Calculators</a><a href="/feedback?from={{ request.url.path|urlencode }}" style="margin-left:auto">Feedback</a></header>
<main>{% block body %}{% endblock %}</main>
<datalist id="payers">{% for p in payers() %}<option>{{ p }}</option>{% endfor %}</datalist>
</body>
</html>
